name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt pytest httpx duckdb pyyaml
      - name: Generate sample data (if not committed)
        run: test -f data_samples/operations_clean.csv || python scripts/generate_sample_data.py
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
        env: { BI_OFFLINE: "1" }   # AI tests use fakes; this guarantees no real API call is ever made

  labs:
    name: Data and AI engineering labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r ai_engineering/requirements.txt duckdb pytest dbt-duckdb
      - name: Data engineering (pipeline tests + dbt build)
        run: |
          python -m pytest data_engineering/tests -q
          python data_engineering/medallion.py --reset
          cd data_engineering/dbt_project && dbt build --profiles-dir .
      - name: AI engineering (offline stub, never calls a real model)
        run: python -m pytest ai_engineering/tests -q
        env: { BI_OFFLINE: "1" }
      - name: Eval gate (must stay at or above 80% on the offline stub)
        working-directory: ai_engineering
        run: python 03_evals.py
        env: { BI_OFFLINE: "1" }

  postgres:
    name: PostgreSQL lab
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: { POSTGRES_PASSWORD: bi_practice, POSTGRES_DB: bi }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "psycopg[binary]" pytest
      - run: python -m pytest postgres_practice/tests -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # tsc runs after the build because Next generates the LayoutProps type during build
      - run: npx tsc --noEmit

  backend-py314:
    name: Backend tests (Python 3.14, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14-dev" }
      - run: pip install -r backend/requirements.txt pytest httpx duckdb pyyaml
      - run: test -f data_samples/operations_clean.csv || python scripts/generate_sample_data.py
      - working-directory: backend
        run: python -m pytest -q
        env: { BI_OFFLINE: "1" }

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images (one retry, Docker Hub pulls sometimes fail)
        run: docker compose build || (sleep 20 && docker compose build)
      - name: Start backend and check /health
        run: |
          docker compose up -d backend
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8020/health && exit 0
            sleep 2
          done
          docker compose logs backend
          exit 1
      - if: always()
        run: docker compose down -v
